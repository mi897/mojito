[project]
name = "mojito"
version = "0.0.0"
description = "Robots that learn to move by themselves: simulation first, then real interaction."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pillow",
]

[project.optional-dependencies]
# MuJoCo physics: mojito/sim, scripts/gait, scripts/stand, the live gait explorer, the site's live physics.
sim = ["mujoco"]
# PyTorch backend (the NumPy backend is the default and needs nothing extra). Pick one build:
# CPU-only wheel, or the CUDA wheel. scripts/setup.sh chooses for you (--cpu, --gpu, or detects).
torch-cpu = ["torch"]
torch-gpu = ["torch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Only the library is packaged; scripts/, tests/, robots/ and results/ stay in the repository.
[tool.hatch.build.targets.wheel]
packages = ["mojito"]

[tool.uv]
# `uv sync` installs the `mojito` package editable into .venv, so scripts import it from anywhere without a sys.path line.
package = true

# The two torch builds cannot be installed together.
conflicts = [[{ extra = "torch-cpu" }, { extra = "torch-gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "torch-cpu", marker = "sys_platform == 'linux'" },
    # cu128 is the first CUDA build with Blackwell (RTX 50xx) support; older cards work too.
    { index = "pytorch-cu128", extra = "torch-gpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
