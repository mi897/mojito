name: site

# Builds the website (site/) from the committed results and publishes it with GitHub Pages.
# One-time set-up by the repository owner: Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The mojito package (no extra dependencies) and NumPy, for the constants of the in-browser simulation
        run: pip install numpy && pip install --no-deps -e .
      - name: Build site data from results/
        run: python scripts/website/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
