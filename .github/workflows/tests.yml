name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [numpy, torch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync ${{ matrix.backend == 'torch' && '--extra torch-cpu' || '' }}
      - name: Unit tests
        run: uv run python -m unittest discover tests -v
      - name: Short training run and scripts on this backend
        env:
          MOJITO_BACKEND: ${{ matrix.backend }}
        run: |
          uv run python scripts/learning/train.py --steps 1500 --out /tmp/ci.npz --log /tmp/ci.json
          uv run python scripts/learning/calibrate.py --out /tmp/cal.json
          uv run python scripts/body/make_body_demos.py --no-gif
          git diff --stat
